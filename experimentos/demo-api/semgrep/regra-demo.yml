rules:
  - id: demo-admin-sem-policy
    languages: [csharp]
    severity: WARNING
    message: O endpoint administrativo InfoAdmin precisa da policy SomenteAdmin.
    metadata:
      cwe:
        - 'CWE-862: Missing Authorization'
    patterns:
      - pattern: |
          [HttpGet("admin-info")]
          public IActionResult InfoAdmin() { ... }
      - pattern-not: |
          [Authorize(Policy = "SomenteAdmin")]
          [HttpGet("admin-info")]
          public IActionResult InfoAdmin() { ... }
